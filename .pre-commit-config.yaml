# See https://pre-commit.com for usage
# On each commit: tests+coverage (pytest, jest), html <br> lint, grammar (advisory), Python linter (ruff), JS linter (eslint), CSS linter (stylelint)
# Setup: pip install -r requirements-dev.txt && npm install && pre-commit install
repos:
  - repo: local
    hooks:
      - id: test
        name: test (pytest + jest, 100% coverage)
        entry: make test
        language: system
        pass_filenames: false
      - id: html-br
        name: html <br> tags (canonical)
        entry: node scripts/lint-html-br.js
        language: system
        pass_filenames: false
      - id: grammar
        name: grammar (Harper, advisory — never blocks)
        entry: node scripts/check-grammar.js
        language: system
        files: ^public/blog/posts/.*\.md$
        pass_filenames: true
        verbose: true
      - id: stylelint
        name: stylelint (CSS)
        entry: npx --no-install stylelint
        language: system
        types: [css]
        pass_filenames: true
      # ESLint runs from package.json's devDependencies (the mirrors-eslint repo is archived, and it
      # installed a second copy of ESLint and its plugins).
      - id: eslint
        name: eslint (JS)
        entry: npx --no-install eslint
        language: system
        types: [javascript]
        pass_filenames: true
      # HTML validation disabled (requires Java). Run manually: html5validator public/
      # - id: html5validator
      #   name: html5validator (lint HTML)
      #   entry: html5validator
      #   language: python
      #   types: [html]
      #   additional_dependencies: [html5validator]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
