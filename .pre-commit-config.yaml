# See https://pre-commit.com for usage
# On each commit: tests+coverage, HTML integrity and <br> checks, grammar (advisory), Python/JS/CSS lint
# Setup: pip install -r requirements-dev.txt && npm install && pre-commit install
repos:
  - repo: local
    hooks:
      - id: test
        name: test (pytest + jest, 100% coverage)
        entry: make test
        language: system
        pass_filenames: false
      - id: html-br
        name: html <br> tags (canonical)
        entry: node scripts/lint-html-br.js
        language: system
        pass_filenames: false
      - id: html-validate
        name: HTML integrity
        entry: npx --no-install html-validate --rule=no-dup-id:error --rule=no-dup-attr:error --rule=attr-quotes:error --rule=no-raw-characters:error --rule=wcag/h37:error
        language: system
        types: [html]
        pass_filenames: true
      - id: grammar
        name: grammar (Harper, advisory — never blocks)
        entry: node scripts/check-grammar.js
        language: system
        files: ^public/blog/posts/.*\.md$
        pass_filenames: true
        verbose: true
      - id: stylelint
        name: stylelint (CSS)
        entry: npx --no-install stylelint
        language: system
        types: [css]
        pass_filenames: true
      # ESLint runs from package.json's devDependencies (the mirrors-eslint repo is archived, and it
      # installed a second copy of ESLint and its plugins).
      - id: eslint
        name: eslint (JS)
        entry: npx --no-install eslint
        language: system
        types: [javascript]
        pass_filenames: true
      # Full html5validator still requires Java; html-validate runs focused integrity rules above.
      # - id: html5validator
      #   name: html5validator (lint HTML)
      #   entry: html5validator
      #   language: python
      #   types: [html]
      #   additional_dependencies: [html5validator]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
