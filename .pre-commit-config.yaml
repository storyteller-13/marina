# See https://pre-commit.com for usage
# On each commit: tests+coverage (pytest, jest), html <br> lint, Python linter (ruff), JS linter (eslint), CSS linter (stylelint)
# Setup: pip install -r requirements-dev.txt && npm install && pre-commit install
repos:
  - repo: local
    hooks:
      - id: test
        name: test (pytest + jest, 100% coverage)
        entry: make test
        language: system
        pass_filenames: false
      - id: html-br
        name: html <br> tags (canonical)
        entry: node scripts/lint-html-br.js
        language: system
        pass_filenames: false
      - id: stylelint
        name: stylelint (CSS)
        entry: npx --no-install stylelint
        language: system
        types: [css]
        pass_filenames: true
      # HTML validation disabled (requires Java). Run manually: html5validator public/
      # - id: html5validator
      #   name: html5validator (lint HTML)
      #   entry: html5validator
      #   language: python
      #   types: [html]
      #   additional_dependencies: [html5validator]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.39.1
    hooks:
      - id: eslint
        types: [javascript]
        additional_dependencies:
          - eslint@^9.39.1
          - "@eslint/js@^9.39.1"
          - "globals@^15.14.0"
