<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc" font-family="Inter, Arial, sans-serif">
  <title id="title">AI agent memory architecture diagram</title>
  <desc id="desc">The agent runtime sits at the center with working memory (the context window). Episodic, semantic, and procedural memory stores surround it. A write path extracts, resolves, and stores memories with temporal validity; a read path retrieves, ranks, and injects memories into the context. A tools/MCP interface and a feedback loop complete the architecture.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
    <marker id="arrow-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="700" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">AI agent memory architecture</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#444444">Agent runtime at the center; four memory types around it; separate write and read paths; feedback closes the loop</text>

  <!-- ===== Long-term memory region (bottom) ===== -->
  <rect x="40" y="440" width="1120" height="200" rx="14" ry="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="464" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">LONG-TERM MEMORY (PERSISTS ACROSS SESSIONS)</text>

  <!-- Episodic store -->
  <rect x="70" y="480" width="300" height="140" rx="10" ry="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="220" y="506" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Episodic memory</text>
  <text x="220" y="526" text-anchor="middle" font-size="12" fill="#444444">session and conversation log, events with timestamps</text>
  <rect x="90" y="545" width="120" height="30" rx="6" ry="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="150" y="564" text-anchor="middle" font-size="12" fill="#111111">Message log</text>
  <rect x="220" y="545" width="130" height="30" rx="6" ry="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="285" y="564" text-anchor="middle" font-size="12" fill="#111111">Tool call traces</text>
  <rect x="90" y="582" width="260" height="30" rx="6" ry="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="220" y="601" text-anchor="middle" font-size="12" fill="#111111">Session summaries (relational / document store)</text>

  <!-- Semantic store -->
  <rect x="410" y="480" width="400" height="140" rx="10" ry="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="610" y="506" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Semantic memory</text>
  <text x="610" y="526" text-anchor="middle" font-size="12" fill="#444444">facts, entities, relationships, with validity windows</text>
  <rect x="430" y="545" width="170" height="64" rx="6" ry="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/>
  <text x="515" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Vector index</text>
  <text x="515" y="588" text-anchor="middle" font-size="12" fill="#444444">embeddings of chunks</text>
  <text x="515" y="603" text-anchor="middle" font-size="12" fill="#444444">and entity summaries</text>
  <rect x="620" y="545" width="170" height="64" rx="6" ry="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
  <text x="705" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Knowledge graph</text>
  <text x="705" y="588" text-anchor="middle" font-size="12" fill="#444444">typed nodes and edges,</text>
  <text x="705" y="603" text-anchor="middle" font-size="12" fill="#444444">valid_from / valid_to</text>
  <line x1="600" y1="577" x2="620" y2="577" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Procedural store -->
  <rect x="850" y="480" width="280" height="140" rx="10" ry="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="990" y="506" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Procedural memory</text>
  <text x="990" y="526" text-anchor="middle" font-size="12" fill="#444444">rules, skills, learned workflows</text>
  <rect x="870" y="545" width="115" height="30" rx="6" ry="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="927" y="564" text-anchor="middle" font-size="12" fill="#111111">Instruction files</text>
  <rect x="995" y="545" width="115" height="30" rx="6" ry="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="1052" y="564" text-anchor="middle" font-size="12" fill="#111111">Skills / tools</text>
  <rect x="870" y="582" width="240" height="30" rx="6" ry="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="990" y="601" text-anchor="middle" font-size="12" fill="#111111">Weighted retrieval policies (from feedback)</text>

  <!-- ===== Agent runtime (center) ===== -->
  <rect x="430" y="130" width="340" height="200" rx="14" ry="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <text x="600" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Agent / LLM runtime</text>
  <text x="600" y="180" text-anchor="middle" font-size="12" fill="#444444">plans, calls tools, decides what to remember</text>

  <!-- Working memory inside the runtime -->
  <rect x="455" y="195" width="290" height="118" rx="10" ry="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="600" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Working memory (context window)</text>
  <rect x="470" y="232" width="125" height="30" rx="6" ry="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <text x="532" y="251" text-anchor="middle" font-size="12" fill="#111111">System prompt</text>
  <rect x="605" y="232" width="125" height="30" rx="6" ry="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <text x="667" y="251" text-anchor="middle" font-size="12" fill="#111111">Recent turns</text>
  <rect x="470" y="270" width="125" height="30" rx="6" ry="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <text x="532" y="289" text-anchor="middle" font-size="12" fill="#111111">Tool results</text>
  <rect x="605" y="270" width="125" height="30" rx="6" ry="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <text x="667" y="289" text-anchor="middle" font-size="12" fill="#111111">Injected memories</text>

  <!-- ===== User / environment (top left) ===== -->
  <rect x="60" y="150" width="200" height="60" rx="10" ry="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="160" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">User / environment</text>
  <text x="160" y="195" text-anchor="middle" font-size="12" fill="#444444">messages, documents, events</text>
  <line x1="260" y1="180" x2="428" y2="180" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="344" y="172" text-anchor="middle" font-size="12" fill="#444444">input</text>

  <!-- ===== Tools / MCP interface (top right) ===== -->
  <rect x="940" y="150" width="200" height="60" rx="10" ry="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="1040" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Tools / MCP interface</text>
  <text x="1040" y="195" text-anchor="middle" font-size="12" fill="#444444">remember &#183; recall &#183; forget</text>
  <line x1="772" y1="180" x2="938" y2="180" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="855" y="172" text-anchor="middle" font-size="12" fill="#444444">tool calls</text>

  <!-- ===== Write path (left column) ===== -->
  <rect x="60" y="250" width="300" height="170" rx="12" ry="12" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/>
  <text x="210" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">Write path</text>
  <rect x="80" y="288" width="260" height="28" rx="6" ry="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="210" y="307" text-anchor="middle" font-size="12" fill="#111111">1. Extract entities, facts, events</text>
  <line x1="210" y1="316" x2="210" y2="326" stroke="#B45309" stroke-width="1.5" marker-end="url(#arrow-write)"/>
  <rect x="80" y="328" width="260" height="28" rx="6" ry="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="210" y="347" text-anchor="middle" font-size="12" fill="#111111">2. Dedupe and resolve entities</text>
  <line x1="210" y1="356" x2="210" y2="366" stroke="#B45309" stroke-width="1.5" marker-end="url(#arrow-write)"/>
  <rect x="80" y="368" width="260" height="28" rx="6" ry="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="210" y="387" text-anchor="middle" font-size="12" fill="#111111">3. Store with temporal validity</text>
  <text x="210" y="412" text-anchor="middle" font-size="12" fill="#92400E">conflicts: supersede, keep history</text>

  <!-- Runtime -> write path -->
  <path d="M 430 300 L 362 300" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-write)"/>
  <text x="396" y="292" text-anchor="middle" font-size="12" fill="#B45309">write</text>
  <!-- Write path -> long-term stores -->
  <path d="M 210 420 L 210 478" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-write)"/>
  <path d="M 300 420 L 300 440 Q 300 452 312 452 L 520 452 Q 532 452 532 464 L 532 478" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-write)"/>

  <!-- ===== Read path (right column) ===== -->
  <rect x="840" y="250" width="300" height="170" rx="12" ry="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="990" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">Read path</text>
  <rect x="860" y="288" width="260" height="28" rx="6" ry="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="990" y="307" text-anchor="middle" font-size="12" fill="#111111">1. Query (rewrite, embed, classify)</text>
  <line x1="990" y1="316" x2="990" y2="326" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrow-read)"/>
  <rect x="860" y="328" width="260" height="28" rx="6" ry="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="990" y="347" text-anchor="middle" font-size="12" fill="#111111">2. Retrieve: vector + graph + keyword</text>
  <line x1="990" y1="356" x2="990" y2="366" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrow-read)"/>
  <rect x="860" y="368" width="260" height="28" rx="6" ry="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="990" y="387" text-anchor="middle" font-size="12" fill="#111111">3. Rank, trim to budget, inject</text>
  <text x="990" y="412" text-anchor="middle" font-size="12" fill="#1E40AF">recency &#183; relevance &#183; validity &#183; weight</text>

  <!-- Read path -> runtime (inject into context) -->
  <path d="M 838 300 L 772 300" fill="none" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow-read)"/>
  <text x="805" y="292" text-anchor="middle" font-size="12" fill="#1D4ED8">inject</text>
  <!-- Long-term stores -> read path -->
  <path d="M 990 478 L 990 420" fill="none" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow-read)"/>
  <path d="M 705 478 L 705 464 Q 705 452 717 452 L 888 452 Q 900 452 900 440 L 900 420" fill="none" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow-read)"/>
  <!-- Query from runtime to read path -->
  <path d="M 772 240 L 850 240" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-read)"/>
  <text x="811" y="232" text-anchor="middle" font-size="12" fill="#1D4ED8">query</text>

  <!-- Episodic -> runtime short-term recall (center up) -->
  <path d="M 600 478 L 600 332" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="600" y="400" text-anchor="middle" font-size="12" fill="#444444">
    <tspan x="600" dy="0">session log</tspan>
    <tspan x="600" dy="16">write and replay</tspan>
  </text>

  <!-- ===== Feedback loop (bottom) ===== -->
  <rect x="380" y="652" width="440" height="36" rx="10" ry="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
  <text x="600" y="675" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Feedback loop: outcomes reweight memories (improve / reinforce)</text>
  <path d="M 1150 180 L 1172 180 Q 1184 180 1184 192 L 1184 658 Q 1184 670 1172 670 L 822 670" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-feedback)"/>
  <text x="1178" y="430" text-anchor="middle" font-size="12" fill="#047857" transform="rotate(-90 1178 430)">task outcomes</text>
  <path d="M 378 670 L 28 670 Q 16 670 16 658 L 16 470 Q 16 458 28 458 L 68 458" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-feedback)"/>
  <path d="M 990 640 L 990 650" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#arrow-feedback)"/>
  <text x="22" y="430" text-anchor="middle" font-size="12" fill="#047857" transform="rotate(-90 22 430)">update weights</text>

  <!-- Legend -->
  <rect x="60" y="80" width="14" height="14" rx="3" ry="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="80" y="92" font-size="12" fill="#111111">Working memory (volatile)</text>
  <rect x="250" y="80" width="14" height="14" rx="3" ry="3" fill="#FFF7ED" stroke="#B45309" stroke-width="1"/>
  <text x="270" y="92" font-size="12" fill="#111111">Write path</text>
  <rect x="360" y="80" width="14" height="14" rx="3" ry="3" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="380" y="92" font-size="12" fill="#111111">Read path</text>
  <rect x="470" y="80" width="14" height="14" rx="3" ry="3" fill="#ECFDF5" stroke="#047857" stroke-width="1"/>
  <text x="490" y="92" font-size="12" fill="#111111">Feedback loop</text>
  <rect x="610" y="80" width="14" height="14" rx="3" ry="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="630" y="92" font-size="12" fill="#111111">Persistent stores</text>
</svg>
