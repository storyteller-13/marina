[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-v",
  "--cov=scripts",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
